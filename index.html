/* =====================================================
   MATERIAL
===================================================== */

function mat(color){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:.8,
        metalness:.05
    });

}


/* =====================================================
   CUBE
===================================================== */

function cube(
    position,
    size,
    color,
    collide=true
){

    const mesh=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                size.x,
                size.y,
                size.z
            ),

            mat(color)

        );


    mesh.position.copy(
        position
    );


    scene.add(
        mesh
    );


    if(collide){

        colliders.push(
            mesh
        );

    }


    return mesh;
}


/* =====================================================
   CLEAR WORLD
===================================================== */

function clearWorld(){

    while(scene.children.length){

        scene.remove(
            scene.children[0]
        );

    }


    colliders.length=0;

    robots=[];


    scene.background=
        new THREE.Color(
            0x172134
        );


    const hemi=
        new THREE.HemisphereLight(
            0xffffff,
            0x283143,
            1.7
        );


    scene.add(
        hemi
    );


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            2
        );


    sun.position.set(
        5,
        10,
        5
    );


    scene.add(
        sun
    );


    cube(
        new THREE.Vector3(
            0,
            -.25,
            0
        ),

        new THREE.Vector3(
            40,
            .5,
            40
        ),

        0x344154
    );

}


/* =====================================================
   PARKOUR
===================================================== */

function buildParkour(){

    clearWorld();


    status.textContent=
        "PARKOUR — push yourself through the course";


    spawnPoint.set(
        0,
        1.6,
        6
    );


    cube(
        new THREE.Vector3(
            0,
            0,
            5
        ),

        new THREE.Vector3(
            7,
            .5,
            7
        ),

        0x4c91ff
    );


    const platforms=[

        [0,1,-0,4,.5,4],

        [3,1.7,-4,3.5,.5,3.5],

        [-2.5,2.5,-8,3.5,.5,3.5],

        [2.5,3.3,-12,3.5,.5,3.5],

        [-2,4.1,-16,3.5,.5,3.5],

        [2,4.9,-20,3.5,.5,3.5],

        [0,5.8,-25,5,.5,5]

    ];


    for(
        const p of platforms
    ){

        cube(

            new THREE.Vector3(
                p[0],
                p[1],
                p[2]
            ),

            new THREE.Vector3(
                p[3],
                p[4],
                p[5]
            ),

            0x438df2

        );

    }


    /* WALLS */

    for(let i=0;i<6;i++){

        cube(

            new THREE.Vector3(
                -5,
                1.5+i*.75,
                -3-i*3.5
            ),

            new THREE.Vector3(
                1.2,
                3,
                1.2
            ),

            0x7b85ff

        );


        cube(

            new THREE.Vector3(
                5,
                1.5+i*.75,
                -5-i*3.5
            ),

            new THREE.Vector3(
                1.2,
                3,
                1.2
            ),

            0x7b85ff

        );

    }


    /* BARS */

    for(let i=0;i<5;i++){

        cube(

            new THREE.Vector3(
                0,
                2.5+i*.75,
                -2-i*4
            ),

            new THREE.Vector3(
                5,
                .22,
                .22
            ),

            0xffd45c

        );

    }


    /* FINISH */

    cube(

        new THREE.Vector3(
            0,
            6.1,
            -25
        ),

        new THREE.Vector3(
            3.5,
            .15,
            3.5
        ),

        0xff5e91

    );

}


/* =====================================================
   ROBOT
===================================================== */

function createRobot(position){

    const robot=
        new THREE.Group();


    const body=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .8,
                1,
                .6
            ),

            mat(0xd94c5c)

        );


    body.position.y=.55;

    robot.add(
        body
    );


    const head=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .7,
                .55,
                .62
            ),

            mat(0xa83243)

        );


    head.position.y=1.35;

    robot.add(
        head
    );


    const eyeMat=
        mat(0x65fff5);


    const eye1=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .07,
                12,
                8
            ),

            eyeMat

        );


    const eye2=
        eye1.clone();


    eye1.position.set(
        -.17,
        1.37,
        -.32
    );


    eye2.position.set(
        .17,
        1.37,
        -.32
    );


    robot.add(
        eye1,
        eye2
    );


    robot.position.copy(
        position
    );


    scene.add(
        robot
    );


    return robot;
}


/* =====================================================
   ROBOT TAG
===================================================== */

function buildRobotTag(){

    clearWorld();


    status.textContent=
        "ROBOT TAG — don't get tagged!";


    spawnPoint.set(
        0,
        1.6,
        10
    );


    cube(

        new THREE.Vector3(
            0,
            0,
            0
        ),

        new THREE.Vector3(
            34,
            .5,
            34
        ),

        0x26384a

    );


    /* ARENA WALLS */

    cube(
        new THREE.Vector3(
            0,3,-17
        ),
        new THREE.Vector3(
            34,6,.5
        ),
        0x53657a
    );


    cube(
        new THREE.Vector3(
            0,3,17
        ),
        new THREE.Vector3(
            34,6,.5
        ),
        0x53657a
    );


    cube(
        new THREE.Vector3(
            -17,3,0
        ),
        new THREE.Vector3(
            .5,6,34
        ),
        0x53657a
    );


    cube(
        new THREE.Vector3(
            17,3,0
        ),
        new THREE.Vector3(
            .5,6,34
        ),
        0x53657a
    );


    /* OBSTACLES */

    for(
        let i=0;
        i<18;
        i++
    ){

        const angle=
            i*Math.PI*2/18;


        const radius=
            7+(i%3)*2;


        cube(

            new THREE.Vector3(

                Math.cos(angle)*radius,

                1,

                Math.sin(angle)*radius

            ),

            new THREE.Vector3(
                2,
                2+(i%3),
                2
            ),

            i%2
                ? 0x3978b7
                : 0x4d9c73

        );

    }


    robots.push(
        createRobot(
            new THREE.Vector3(
                -8,.7,-8
            )
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(
                8,.7,-8
            )
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(
                0,.7,-12
            )
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(
                10,.7,5
            )
        )
    );

}
