<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Monkey Motion VR</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111722;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:auto;
}

#panel{
    width:min(520px,90vw);
    padding:25px;

    background:rgba(10,15,25,.96);

    border:2px solid #58e7ff;
    border-radius:20px;

    color:white;
    text-align:center;

    box-shadow:0 0 35px rgba(88,231,255,.25);
}

#panel h1{
    margin-top:0;
    font-size:34px;
}

button{
    border:0;
    border-radius:12px;

    padding:14px 20px;
    margin:6px;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

#startVR{
    background:#58e7ff;
}

#parkourBtn{
    background:#67f38f;
}

#tagBtn{
    background:#ffbd5c;
}

#status{
    position:fixed;
    left:12px;
    top:12px;

    z-index:50;

    color:white;
    background:rgba(0,0,0,.55);

    padding:9px 12px;
    border-radius:10px;

    font-size:14px;
    pointer-events:none;
}

#debug{
    position:fixed;
    right:12px;
    top:12px;

    z-index:50;

    color:white;
    background:rgba(0,0,0,.55);

    padding:8px 10px;
    border-radius:8px;

    font-family:monospace;
    font-size:11px;

    pointer-events:none;
}
</style>
</head>

<body>

<div id="menu">
    <div id="panel">

        <h1>🐒 Monkey Motion VR</h1>

        <p>
            Push off surfaces with your hands
            to move like a monkey.
        </p>

        <button id="startVR">
            START VR
        </button>

        <button id="parkourBtn">
            PARKOUR
        </button>

        <button id="tagBtn">
            ROBOT TAG
        </button>

        <p style="font-size:13px;opacity:.65">
            Designed for Meta Quest Browser.
        </p>

    </div>
</div>

<div id="status">
    Waiting for VR...
</div>

<div id="debug">
    LEFT: --<br>
    RIGHT: --
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js";


/* =====================================================
   GLOBALS
===================================================== */

let scene;
let camera;
let renderer;
let player;

let gameStarted=false;
let mode="parkour";

const controllers=[null,null];
const grips=[null,null];
const hands=[null,null];

const handPositions=[
    new THREE.Vector3(),
    new THREE.Vector3()
];

const previousHands=[
    new THREE.Vector3(),
    new THREE.Vector3()
];

const handDelta=[
    new THREE.Vector3(),
    new THREE.Vector3()
];

const handInitialized=[
    false,
    false
];

const velocity=new THREE.Vector3();

const spawnPoint=new THREE.Vector3(
    0,
    1.6,
    6
);

const colliders=[];
const worldObjects=[];

let robots=[];

const HAND_RADIUS=.16;
const PLAYER_RADIUS=.35;

const MAX_SPEED=7;
const GRAVITY=-10;
const PUSH_STRENGTH=7;

const menu=document.getElementById("menu");
const status=document.getElementById("status");
const debug=document.getElementById("debug");


/* =====================================================
   MATERIAL
===================================================== */

function mat(color){

    return new THREE.MeshStandardMaterial({
        color,
        roughness:.8,
        metalness:.05
    });

}


/* =====================================================
   WORLD OBJECT
===================================================== */

function cube(position,size,color,collide=true){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(
            size.x,
            size.y,
            size.z
        ),
        mat(color)
    );

    mesh.position.copy(position);

    scene.add(mesh);

    worldObjects.push(mesh);

    if(collide){
        colliders.push(mesh);
    }

    return mesh;
}


/* =====================================================
   CLEAR ONLY THE WORLD
   IMPORTANT:
   DO NOT DELETE PLAYER/CAMERA/CONTROLLERS
===================================================== */

function clearWorld(){

    for(const object of worldObjects){

        scene.remove(object);

        object.geometry.dispose();

        if(object.material){
            object.material.dispose();
        }

    }

    worldObjects.length=0;
    colliders.length=0;
    robots=[];


    scene.background=
        new THREE.Color(0x172134);


    const hemi=
        new THREE.HemisphereLight(
            0xffffff,
            0x283143,
            1.7
        );

    scene.add(hemi);

    worldObjects.push(hemi);


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    sun.position.set(
        5,
        10,
        5
    );

    scene.add(sun);

    worldObjects.push(sun);


    cube(
        new THREE.Vector3(0,-.25,0),
        new THREE.Vector3(40,.5,40),
        0x344154
    );

}


/* =====================================================
   PARKOUR
===================================================== */

function buildParkour(){

    clearWorld();

    status.textContent=
        "PARKOUR — push yourself through the course";

    spawnPoint.set(
        0,
        1.6,
        6
    );


    cube(
        new THREE.Vector3(0,0,5),
        new THREE.Vector3(7,.5,7),
        0x4c91ff
    );


    const platforms=[

        [0,1,0,4,.5,4],
        [3,1.7,-4,3.5,.5,3.5],
        [-2.5,2.5,-8,3.5,.5,3.5],
        [2.5,3.3,-12,3.5,.5,3.5],
        [-2,4.1,-16,3.5,.5,3.5],
        [2,4.9,-20,3.5,.5,3.5],
        [0,5.8,-25,5,.5,5]

    ];


    for(const p of platforms){

        cube(
            new THREE.Vector3(
                p[0],
                p[1],
                p[2]
            ),

            new THREE.Vector3(
                p[3],
                p[4],
                p[5]
            ),

            0x438df2
        );

    }


    for(let i=0;i<6;i++){

        cube(
            new THREE.Vector3(
                -5,
                1.5+i*.75,
                -3-i*3.5
            ),

            new THREE.Vector3(
                1.2,
                3,
                1.2
            ),

            0x7b85ff
        );


        cube(
            new THREE.Vector3(
                5,
                1.5+i*.75,
                -5-i*3.5
            ),

            new THREE.Vector3(
                1.2,
                3,
                1.2
            ),

            0x7b85ff
        );

    }


    for(let i=0;i<5;i++){

        cube(
            new THREE.Vector3(
                0,
                2.5+i*.75,
                -2-i*4
            ),

            new THREE.Vector3(
                5,
                .22,
                .22
            ),

            0xffd45c
        );

    }


    cube(
        new THREE.Vector3(0,6.1,-25),
        new THREE.Vector3(3.5,.15,3.5),
        0xff5e91
    );

}


/* =====================================================
   ROBOT
===================================================== */

function createRobot(position){

    const robot=new THREE.Group();

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(.8,1,.6),
        mat(0xd94c5c)
    );

    body.position.y=.55;

    robot.add(body);


    const head=new THREE.Mesh(
        new THREE.BoxGeometry(.7,.55,.62),
        mat(0xa83243)
    );

    head.position.y=1.35;

    robot.add(head);


    const eyeMat=mat(0x65fff5);


    const eye1=new THREE.Mesh(
        new THREE.SphereGeometry(.07,12,8),
        eyeMat
    );

    const eye2=eye1.clone();

    eye1.position.set(
        -.17,
        1.37,
        -.32
    );

    eye2.position.set(
        .17,
        1.37,
        -.32
    );

    robot.add(
        eye1,
        eye2
    );


    robot.position.copy(position);

    scene.add(robot);

    worldObjects.push(robot);

    return robot;
}


/* =====================================================
   ROBOT TAG
===================================================== */

function buildRobotTag(){

    clearWorld();

    status.textContent=
        "ROBOT TAG — don't get tagged!";

    spawnPoint.set(
        0,
        1.6,
        10
    );


    cube(
        new THREE.Vector3(0,0,0),
        new THREE.Vector3(34,.5,34),
        0x26384a
    );


    cube(
        new THREE.Vector3(0,3,-17),
        new THREE.Vector3(34,6,.5),
        0x53657a
    );


    cube(
        new THREE.Vector3(0,3,17),
        new THREE.Vector3(34,6,.5),
        0x53657a
    );


    cube(
        new THREE.Vector3(-17,3,0),
        new THREE.Vector3(.5,6,34),
        0x53657a
    );


    cube(
        new THREE.Vector3(17,3,0),
        new THREE.Vector3(.5,6,34),
        0x53657a
    );


    for(let i=0;i<18;i++){

        const angle=
            i*Math.PI*2/18;

        const radius=
            7+(i%3)*2;

        cube(
            new THREE.Vector3(
                Math.cos(angle)*radius,
                1,
                Math.sin(angle)*radius
            ),

            new THREE.Vector3(
                2,
                2+(i%3),
                2
            ),

            i%2
                ? 0x3978b7
                : 0x4d9c73
        );

    }


    robots.push(
        createRobot(
            new THREE.Vector3(-8,.7,-8)
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(8,.7,-8)
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(0,.7,-12)
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(10,.7,5)
        )
    );

}


/* =====================================================
   HAND
===================================================== */

function createHand(index){

    const group=new THREE.Group();

    const handMaterial=mat(
        index===0
            ? 0xff5555
            : 0x5588ff
    );


    const palm=new THREE.Mesh(
        new THREE.SphereGeometry(
            .15,
            20,
            16
        ),
        handMaterial
    );

    palm.scale.set(
        1,
        .8,
        1.25
    );

    group.add(palm);


    for(let i=0;i<4;i++){

        const finger=new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .035,
                .11,
                4,
                8
            ),
            handMaterial
        );

        finger.position.set(
            -.09+i*.06,
            -.015,
            -.13
        );

        finger.rotation.x=
            Math.PI/2;

        group.add(finger);

    }


    return group;
}


/* =====================================================
   INITIALIZE
===================================================== */

function init(){

    if(gameStarted)
        return;


    gameStarted=true;


    scene=new THREE.Scene();


    camera=new THREE.PerspectiveCamera(
        70,
        window.innerWidth/
        window.innerHeight,
        .01,
        1000
    );


    player=new THREE.Group();

    scene.add(player);

    player.add(camera);


    camera.position.set(
        0,
        1.6,
        0
    );


    renderer=new THREE.WebGLRenderer({
        antialias:true
    });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.5
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.xr.enabled=true;


    renderer.xr.setReferenceSpaceType(
        "local-floor"
    );


    document.body.appendChild(
        renderer.domElement
    );


    setupControllers();


    buildParkour();


    renderer.setAnimationLoop(
        gameLoop
    );

}


/* =====================================================
   CONTROLLERS
===================================================== */

function setupControllers(){

    for(let i=0;i<2;i++){

        /*
         * INPUT
         */
        const controller=
            renderer.xr.getController(i);

        controllers[i]=controller;

        scene.add(controller);


        /*
         * PHYSICAL GRIP POSE
         * THIS IS THE METHOD WE TESTED
         * AND CONFIRMED WORKS.
         */
        const grip=
            renderer.xr.getControllerGrip(i);

        grips[i]=grip;

        scene.add(grip);


        /*
         * VISIBLE HAND
         */
        const hand=
            createHand(i);

        hands[i]=hand;

        grip.add(hand);


        controller.addEventListener(
            "connected",
            event=>{

                controller.userData.source=
                    event.data;

            }
        );


        controller.addEventListener(
            "disconnected",
            ()=>{

                controller.userData.source=
                    null;

                handInitialized[i]=
                    false;

            }
        );


        controller.addEventListener(
            "selectstart",
            resetPlayer
        );


        controller.addEventListener(
            "squeezestart",
            resetPlayer
        );

    }

}


/* =====================================================
   HAND COLLISION
===================================================== */

function handTouchesWorld(position){

    const closest=
        new THREE.Vector3();


    for(const object of colliders){

        const box=
            new THREE.Box3()
                .setFromObject(object);


        box.clampPoint(
            position,
            closest
        );


        if(
            closest.distanceTo(position)
            <= HAND_RADIUS
        ){

            return true;

        }

    }


    return false;
}


/* =====================================================
   GTAG MOVEMENT
===================================================== */

function updateGTAGMovement(){

    const totalPush=
        new THREE.Vector3();

    let pushCount=0;


    for(let i=0;i<2;i++){

        if(!grips[i])
            continue;


        grips[i].getWorldPosition(
            handPositions[i]
        );


        if(!handInitialized[i]){

            previousHands[i].copy(
                handPositions[i]
            );

            handInitialized[i]=true;

            continue;
        }


        handDelta[i]
            .copy(handPositions[i])
            .sub(previousHands[i]);


        const distance=
            handDelta[i].length();


        const touching=
            handTouchesWorld(
                handPositions[i]
            );


        if(
            touching &&
            distance>.004 &&
            distance<.45
        ){

            totalPush.add(
                handDelta[i]
                    .clone()
                    .negate()
            );

            pushCount++;

        }


        previousHands[i].copy(
            handPositions[i]
        );

    }


    if(pushCount>0){

        totalPush.multiplyScalar(
            1/pushCount
        );


        totalPush.multiplyScalar(
            PUSH_STRENGTH
        );


        velocity.add(
            totalPush
        );

    }


    if(
        velocity.length()>MAX_SPEED
    ){

        velocity.setLength(
            MAX_SPEED
        );

    }

}


/* =====================================================
   PLAYER COLLISION
===================================================== */

function playerCollision(){

    const worldPosition=
        new THREE.Vector3();


    player.getWorldPosition(
        worldPosition
    );


    /*
     * Keep player above the floor.
     */

    if(player.position.y<0){

        player.position.y=0;

        if(velocity.y<0)
            velocity.y=0;

    }


    /*
     * Basic wall/body collision.
     */

    for(const object of colliders){

        const box=
            new THREE.Box3()
                .setFromObject(object);


        box.expandByScalar(
            PLAYER_RADIUS
        );


        if(
            box.containsPoint(
                worldPosition
            )
        ){

            const center=
                box.getCenter(
                    new THREE.Vector3()
                );


            const difference=
                worldPosition
                    .clone()
                    .sub(center);


            if(
                Math.abs(difference.x)>
                Math.abs(difference.z)
            ){

                player.position.x+=
                    difference.x>0
                        ? .04
                        : -.04;

                velocity.x=0;

            }else{

                player.position.z+=
                    difference.z>0
                        ? .04
                        : -.04;

                velocity.z=0;

            }

        }

    }

}


/* =====================================================
   TURNING
===================================================== */

function updateTurning(delta){

    if(!renderer.xr.isPresenting)
        return;


    for(const controller of controllers){

        if(!controller)
            continue;


        const source=
            controller.userData.source;


        if(
            !source ||
            !source.gamepad
        )
            continue;


        const axes=
            source.gamepad.axes;


        if(
            !axes ||
            axes.length<4
        )
            continue;


        const x=axes[2];


        if(Math.abs(x)>.25){

            player.rotation.y-=
                x*
                delta*
                1.7;

        }

    }

}


/* =====================================================
   GRAVITY
===================================================== */

function gravity(delta){

    velocity.y+=
        GRAVITY*
        delta;


    if(velocity.y<-12)
        velocity.y=-12;

}


/* =====================================================
   ROBOTS
===================================================== */

function updateRobots(delta){

    for(const robot of robots){

        const target=
            player.position.clone();


        target.y=
            robot.position.y;


        const direction=
            target.sub(
                robot.position
            );


        const distance=
            direction.length();


        if(distance<.01)
            continue;


        direction.normalize();


        let speed=2;


        if(distance<8)
            speed=3.5;


        if(distance<4)
            speed=4.5;


        robot.position.add(
            direction.multiplyScalar(
                speed*delta
            )
        );


        robot.lookAt(
            player.position.x,
            robot.position.y,
            player.position.z
        );


        if(
            robot.position.distanceTo(
                player.position
            )<1.3
        ){

            status.textContent=
                "🤖 TAGGED! Press trigger to reset.";

            velocity.set(0,0,0);

        }

    }

}


/* =====================================================
   UPDATE
===================================================== */

function update(delta){

    updateGTAGMovement();

    updateTurning(delta);

    gravity(delta);


    player.position.addScaledVector(
        velocity,
        delta
    );


    velocity.x*=
        Math.pow(.94,delta*60);

    velocity.z*=
        Math.pow(.94,delta*60);


    playerCollision();


    if(player.position.y<-8){

        resetPlayer();

    }


    if(
        mode==="parkour" &&
        player.position.z<-23
    ){

        status.textContent=
            "🏆 PARKOUR COMPLETE!";

    }


    if(mode==="tag"){

        updateRobots(delta);

    }

}


/* =====================================================
   DEBUG
===================================================== */

function updateDebug(){

    let text="";


    for(let i=0;i<2;i++){

        const p=
            handPositions[i];


        text+=
            (i===0?"L":"R")+
            ": "+
            p.x.toFixed(1)+
            " "+
            p.y.toFixed(1)+
            " "+
            p.z.toFixed(1);


        if(i===0)
            text+="\n";

    }


    debug.innerHTML=text;

}


/* =====================================================
   LOOP
===================================================== */

let lastTime=
    performance.now();


function gameLoop(){

    const now=
        performance.now();


    let delta=
        (now-lastTime)/1000;


    lastTime=now;


    delta=
        Math.min(
            delta,
            .05
        );


    update(delta);

    updateDebug();


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESET
===================================================== */

function resetPlayer(){

    if(!player)
        return;


    /*
     * Player root is at floor height.
     * Camera is 1.6m above it.
     */

    player.position.set(
        spawnPoint.x,
        0,
        spawnPoint.z
    );


    player.rotation.set(
        0,
        0,
        0
    );


    camera.position.set(
        0,
        spawnPoint.y,
        0
    );


    velocity.set(
        0,
        0,
        0
    );


    for(let i=0;i<2;i++){

        handInitialized[i]=false;

    }

}


/* =====================================================
   SWITCH MODE
===================================================== */

function switchMode(newMode){

    mode=newMode;


    if(mode==="parkour"){

        buildParkour();

    }else{

        buildRobotTag();

    }


    resetPlayer();

}


/* =====================================================
   START VR
===================================================== */

document.getElementById("startVR").onclick=
async()=>{

    try{

        init();


        if(!navigator.xr){

            alert(
                "WebXR is not available in this browser."
            );

            return;

        }


        const supported=
            await navigator.xr
                .isSessionSupported(
                    "immersive-vr"
                );


        if(!supported){

            alert(
                "Immersive VR is not supported."
            );

            return;

        }


        const session=
            await navigator.xr
                .requestSession(
                    "immersive-vr",
                    {
                        requiredFeatures:[
                            "local-floor"
                        ],

                        optionalFeatures:[
                            "bounded-floor"
                        ]
                    }
                );


        await renderer.xr.setSession(
            session
        );


        menu.style.display="none";


        status.textContent=
            "🐒 VR ACTIVE — PUSH OFF THE WORLD!";


        session.addEventListener(
            "end",
            ()=>{

                menu.style.display=
                    "flex";

                status.textContent=
                    "VR session ended.";

            }
        );

    }
    catch(error){

        console.error(error);

        alert(
            "VR error:\n"+
            error.message
        );

    }

};


/* =====================================================
   PARKOUR BUTTON
===================================================== */

document.getElementById("parkourBtn").onclick=
()=>{

    console.log("PARKOUR BUTTON CLICKED");

    init();

    switchMode("parkour");

    menu.style.display="none";

};


/* =====================================================
   TAG BUTTON
===================================================== */

document.getElementById("tagBtn").onclick=
()=>{

    console.log("TAG BUTTON CLICKED");

    init();

    switchMode("tag");

    menu.style.display="none";

};


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        if(!camera || !renderer)
            return;


        camera.aspect=
            window.innerWidth/
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
