<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Monkey Motion VR</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#101722;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:auto;
}

#panel{
    width:min(520px,90vw);
    padding:25px;

    background:rgba(10,15,25,.96);

    border:2px solid #58e7ff;
    border-radius:20px;

    color:white;
    text-align:center;

    box-shadow:0 0 35px rgba(88,231,255,.25);
}

#panel h1{
    margin-top:0;
    font-size:34px;
}

button{
    border:0;
    border-radius:12px;
    padding:14px 20px;
    margin:6px;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
}

#startVR{
    background:#58e7ff;
}

#parkourBtn{
    background:#67f38f;
}

#tagBtn{
    background:#ffbd5c;
}

#status{
    position:fixed;
    left:12px;
    top:12px;

    z-index:50;

    color:white;
    background:rgba(0,0,0,.55);

    padding:9px 12px;
    border-radius:10px;

    font-size:14px;
    pointer-events:none;
}

#debug{
    position:fixed;
    right:12px;
    top:12px;

    z-index:50;

    color:white;
    background:rgba(0,0,0,.55);

    padding:8px 10px;
    border-radius:8px;

    font-family:monospace;
    font-size:11px;

    pointer-events:none;
}

</style>
</head>

<body>

<!-- =====================================================
     MENU
===================================================== -->

<div id="menu">

    <div id="panel">

        <h1>🐒 Monkey Motion VR</h1>

        <p>
            Push off the world with your hands.
        </p>

        <button id="startVR">
            START VR
        </button>

        <button id="parkourBtn">
            PARKOUR
        </button>

        <button id="tagBtn">
            ROBOT TAG
        </button>

        <p style="font-size:13px;opacity:.65">
            Meta Quest WebXR
        </p>

    </div>

</div>

<div id="status">
    Waiting for VR...
</div>

<div id="debug">
    LEFT: --<br>
    RIGHT: --
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js";


/* =====================================================
   GLOBALS
===================================================== */

let scene;
let camera;
let renderer;
let player;

let gameStarted=false;
let mode="parkour";

let lastTime=performance.now();


/* =====================================================
   CONTROLLERS
===================================================== */

/*
    IMPORTANT:

    Controllers and grips are CHILDREN OF THE SCENE,
    NOT THE PLAYER.

    This means Quest continues giving us the real
    physical controller position even while the player
    moves.
*/

const controllers=[
    null,
    null
];

const grips=[
    null,
    null
];

const hands=[
    null,
    null
];


/* =====================================================
   HAND POSITION DATA
===================================================== */

const handPositions=[
    new THREE.Vector3(),
    new THREE.Vector3()
];

const previousHands=[
    new THREE.Vector3(),
    new THREE.Vector3()
];

const handDelta=[
    new THREE.Vector3(),
    new THREE.Vector3()
];

const handTouching=[
    false,
    false
];

const handWasTouching=[
    false,
    false
];

const handInitialized=[
    false,
    false
];


/* =====================================================
   PLAYER
===================================================== */

const velocity=
    new THREE.Vector3();


const spawnPoint=
    new THREE.Vector3(
        0,
        1.6,
        6
    );


/* =====================================================
   WORLD
===================================================== */

const colliders=[];
const worldObjects=[];

let robots=[];


/* =====================================================
   SETTINGS
===================================================== */

const HAND_RADIUS=0.17;

const PLAYER_RADIUS=0.30;

const MAX_RELEASE_SPEED=7;

const GRAVITY=-9.8;


/*
    1.0 = physical hand displacement.

    Start at 1.

    This makes the movement predictable:
    hand moves 20 cm backwards
    → body moves 20 cm forwards.
*/

const PUSH_MULTIPLIER=1.0;


/*
    Small amount of momentum after releasing
    a surface.
*/

const RELEASE_MOMENTUM=0.35;


/* =====================================================
   UI
===================================================== */

const menu=
    document.getElementById("menu");

const status=
    document.getElementById("status");

const debug=
    document.getElementById("debug");


/* =====================================================
   MATERIAL
===================================================== */

function mat(color){

    return new THREE.MeshStandardMaterial({

        color:color,

        roughness:.8,

        metalness:.05

    });

}


/* =====================================================
   CREATE CUBE
===================================================== */

function cube(
    position,
    size,
    color,
    collide=true
){

    const mesh=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                size.x,
                size.y,
                size.z
            ),

            mat(color)

        );


    mesh.position.copy(
        position
    );


    scene.add(
        mesh
    );


    worldObjects.push(
        mesh
    );


    if(collide){

        colliders.push(
            mesh
        );

    }


    return mesh;
}


/* =====================================================
   CLEAR WORLD
===================================================== */

function clearWorld(){

    /*
       Only delete map objects.

       NEVER delete the player,
       camera, controllers or hands.
    */

    for(
        const object of worldObjects
    ){

        scene.remove(
            object
        );

        if(
            object.geometry
        ){

            object.geometry.dispose();

        }


        if(
            object.material
        ){

            if(
                Array.isArray(
                    object.material
                )
            ){

                for(
                    const m of object.material
                ){

                    m.dispose();

                }

            }else{

                object.material.dispose();

            }

        }

    }


    worldObjects.length=0;

    colliders.length=0;

    robots=[];


    scene.background=
        new THREE.Color(
            0x172134
        );


    const hemi=
        new THREE.HemisphereLight(
            0xffffff,
            0x283143,
            1.7
        );


    scene.add(
        hemi
    );


    worldObjects.push(
        hemi
    );


    const sun=
        new THREE.DirectionalLight(
            0xffffff,
            2
        );


    sun.position.set(
        5,
        10,
        5
    );


    scene.add(
        sun
    );


    worldObjects.push(
        sun
    );


    /*
       Main floor.
    */

    cube(

        new THREE.Vector3(
            0,
            -.25,
            0
        ),

        new THREE.Vector3(
            40,
            .5,
            40
        ),

        0x344154

    );

}


/* =====================================================
   PARKOUR MAP
===================================================== */

function buildParkour(){

    clearWorld();


    mode="parkour";


    status.textContent=
        "PARKOUR — push with your hands";


    spawnPoint.set(
        0,
        1.6,
        6
    );


    cube(

        new THREE.Vector3(
            0,
            0,
            5
        ),

        new THREE.Vector3(
            7,
            .5,
            7
        ),

        0x4c91ff

    );


    const platforms=[

        [0,1,0,4,.5,4],

        [3,1.7,-4,3.5,.5,3.5],

        [-2.5,2.5,-8,3.5,.5,3.5],

        [2.5,3.3,-12,3.5,.5,3.5],

        [-2,4.1,-16,3.5,.5,3.5],

        [2,4.9,-20,3.5,.5,3.5],

        [0,5.8,-25,5,.5,5]

    ];


    for(
        const p of platforms
    ){

        cube(

            new THREE.Vector3(
                p[0],
                p[1],
                p[2]
            ),

            new THREE.Vector3(
                p[3],
                p[4],
                p[5]
            ),

            0x438df2

        );

    }


    /*
       Tall climbing blocks.
    */

    for(
        let i=0;
        i<6;
        i++
    ){

        cube(

            new THREE.Vector3(
                -5,
                1.5+i*.75,
                -3-i*3.5
            ),

            new THREE.Vector3(
                1.2,
                3,
                1.2
            ),

            0x7b85ff

        );


        cube(

            new THREE.Vector3(
                5,
                1.5+i*.75,
                -5-i*3.5
            ),

            new THREE.Vector3(
                1.2,
                3,
                1.2
            ),

            0x7b85ff

        );

    }


    /*
       Bars.
    */

    for(
        let i=0;
        i<5;
        i++
    ){

        cube(

            new THREE.Vector3(
                0,
                2.5+i*.75,
                -2-i*4
            ),

            new THREE.Vector3(
                5,
                .22,
                .22
            ),

            0xffd45c

        );

    }


    /*
       Finish.
    */

    cube(

        new THREE.Vector3(
            0,
            6.1,
            -25
        ),

        new THREE.Vector3(
            3.5,
            .15,
            3.5
        ),

        0xff5e91

    );

}


/* =====================================================
   ROBOT
===================================================== */

function createRobot(position){

    const robot=
        new THREE.Group();


    const body=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .8,
                1,
                .6
            ),

            mat(0xd94c5c)

        );


    body.position.y=.55;

    robot.add(
        body
    );


    const head=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                .7,
                .55,
                .62
            ),

            mat(0xa83243)

        );


    head.position.y=1.35;

    robot.add(
        head
    );


    const eyeMaterial=
        mat(0x65fff5);


    const eye1=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .07,
                12,
                8
            ),

            eyeMaterial

        );


    const eye2=
        eye1.clone();


    eye1.position.set(
        -.17,
        1.37,
        -.32
    );


    eye2.position.set(
        .17,
        1.37,
        -.32
    );


    robot.add(
        eye1,
        eye2
    );


    robot.position.copy(
        position
    );


    scene.add(
        robot
    );


    worldObjects.push(
        robot
    );


    return robot;
}


/* =====================================================
   ROBOT TAG MAP
===================================================== */

function buildRobotTag(){

    clearWorld();


    mode="tag";


    status.textContent=
        "ROBOT TAG — don't get tagged!";


    spawnPoint.set(
        0,
        1.6,
        10
    );


    /*
       Arena floor.
    */

    cube(

        new THREE.Vector3(
            0,
            0,
            0
        ),

        new THREE.Vector3(
            34,
            .5,
            34
        ),

        0x26384a

    );


    /*
       Arena walls.
    */

    cube(
        new THREE.Vector3(
            0,3,-17
        ),
        new THREE.Vector3(
            34,6,.5
        ),
        0x53657a
    );


    cube(
        new THREE.Vector3(
            0,3,17
        ),
        new THREE.Vector3(
            34,6,.5
        ),
        0x53657a
    );


    cube(
        new THREE.Vector3(
            -17,3,0
        ),
        new THREE.Vector3(
            .5,6,34
        ),
        0x53657a
    );


    cube(
        new THREE.Vector3(
            17,3,0
        ),
        new THREE.Vector3(
            .5,6,34
        ),
        0x53657a
    );


    /*
       Obstacles.
    */

    for(
        let i=0;
        i<18;
        i++
    ){

        const angle=
            i*Math.PI*2/18;


        const radius=
            7+(i%3)*2;


        cube(

            new THREE.Vector3(

                Math.cos(angle)*radius,

                1,

                Math.sin(angle)*radius

            ),

            new THREE.Vector3(
                2,
                2+(i%3),
                2
            ),

            i%2
                ? 0x3978b7
                : 0x4d9c73

        );

    }


    robots.push(
        createRobot(
            new THREE.Vector3(
                -8,.7,-8
            )
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(
                8,.7,-8
            )
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(
                0,.7,-12
            )
        )
    );


    robots.push(
        createRobot(
            new THREE.Vector3(
                10,.7,5
            )
        )
    );

}


/* =====================================================
   CREATE VISIBLE HAND
===================================================== */

function createHand(index){

    const group=
        new THREE.Group();


    const handMaterial=
        mat(
            index===0
                ? 0xff4444
                : 0x4488ff
        );


    /*
       Palm.
    */

    const palm=
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .15,
                20,
                16
            ),

            handMaterial

        );


    palm.scale.set(
        1,
        .8,
        1.25
    );


    group.add(
        palm
    );


    /*
       Four fingers.
    */

    for(
        let i=0;
        i<4;
        i++
    ){

        const finger=
            new THREE.Mesh(

                new THREE.CapsuleGeometry(
                    .035,
                    .11,
                    4,
                    8
                ),

                handMaterial

            );


        finger.position.set(

            -.09+i*.06,

            -.015,

            -.13

        );


        finger.rotation.x=
            Math.PI/2;


        group.add(
            finger
        );

    }


    return group;
}


/* =====================================================
   INITIALIZE
===================================================== */

function init(){

    if(gameStarted)
        return;


    gameStarted=true;


    scene=
        new THREE.Scene();


    scene.background=
        new THREE.Color(
            0x172134
        );


    /*
       XR camera.

       We DO NOT manually move this camera
       during gameplay.
    */

    camera=
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth/
            window.innerHeight,

            .01,

            1000

        );


    /*
       Player root.

       This is what moves when you push
       with your hands.
    */

    player=
        new THREE.Group();


    scene.add(
        player
    );


    player.add(
        camera
    );


    /*
       The camera stays 1.6m above
       the player's body origin.
    */

    camera.position.set(
        0,
        1.6,
        0
    );


    renderer=
        new THREE.WebGLRenderer({

            antialias:true

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.5
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.xr.enabled=true;


    renderer.xr.setReferenceSpaceType(
        "local-floor"
    );


    document.body.appendChild(
        renderer.domElement
    );


    setupControllers();


    buildParkour();


    renderer.setAnimationLoop(
        gameLoop
    );

}


/* =====================================================
   CONTROLLERS
===================================================== */

function setupControllers(){

    for(
        let i=0;
        i<2;
        i++
    ){

        /*
           Controller INPUT.
        */

        const controller=
            renderer.xr.getController(i);


        controllers[i]=
            controller;


        /*
           IMPORTANT:
           controller is in SCENE space.
        */

        scene.add(
            controller
        );


        /*
           REAL PHYSICAL GRIP POSE.

           This is the exact system that
           worked in our controller test.
        */

        const grip=
            renderer.xr.getControllerGrip(i);


        grips[i]=
            grip;


        /*
           ALSO IN SCENE SPACE.

           NEVER put this under player.
        */

        scene.add(
            grip
        );


        /*
           Visible monkey hand.

           The game NEVER changes its
           position. Quest does.
        */

        const hand=
            createHand(i);


        hands[i]=
            hand;


        grip.add(
            hand
        );


        controller.addEventListener(
            "connected",
            event=>{

                controller.userData.source=
                    event.data;

                console.log(
                    "Controller connected:",
                    i,
                    event.data.handedness
                );

            }
        );


        controller.addEventListener(
            "disconnected",
            ()=>{

                controller.userData.source=
                    null;

                handInitialized[i]=
                    false;

            }
        );


        /*
           Trigger = reset.
        */

        controller.addEventListener(
            "selectstart",
            resetPlayer
        );


        controller.addEventListener(
            "squeezestart",
            resetPlayer
        );

    }

}


/* =====================================================
   HAND COLLISION
===================================================== */

function handTouchesWorld(position){

    const closest=
        new THREE.Vector3();


    for(
        const object of colliders
    ){

        const box=
            new THREE.Box3()
                .setFromObject(
                    object
                );


        box.clampPoint(
            position,
            closest
        );


        if(
            closest.distanceTo(
                position
            ) <= HAND_RADIUS
        ){

            return true;

        }

    }


    return false;
}


/* =====================================================
   CORRECTED GTAG LOCOMOTION
===================================================== */

/*
    THIS IS THE IMPORTANT PART.

    We don't make the hands move.

    Quest gives us the actual hand position.

    If the hand is touching a surface:

        hand moves DOWN
              ↓
        player moves UP

        hand moves BACK
              ↓
        player moves FORWARD

    The hand remains exactly where Quest
    says it physically is.
*/

function updateGTAGMovement(){

    let totalMovement=
        new THREE.Vector3();


    let pushingHands=0;


    for(
        let i=0;
        i<2;
        i++
    ){

        if(
            !grips[i]
        ){

            continue;

        }


        /*
           Get REAL tracked position.

           This is NOT relative to player.
        */

        grips[i].getWorldPosition(
            handPositions[i]
        );


        /*
           First frame after connecting/resetting.

           Don't create a fake movement spike.
        */

        if(
            !handInitialized[i]
        ){

            previousHands[i].copy(
                handPositions[i]
            );

            handInitialized[i]=true;

            handWasTouching[i]=false;

            continue;

        }


        /*
           Calculate actual physical hand
           movement since last frame.
        */

        handDelta[i]
            .copy(
                handPositions[i]
            )
            .sub(
                previousHands[i]
            );


        const distance=
            handDelta[i].length();


        /*
           Is the real hand touching a wall,
           floor, platform, etc?
        */

        handTouching[i]=
            handTouchesWorld(
                handPositions[i]
            );


        /*
           We only push when:

           1. Hand was touching
           2. Hand is still touching
           3. Hand actually moved
        */

        if(
            handTouching[i] &&
            handWasTouching[i] &&
            distance>.002 &&
            distance<.20
        ){

            /*
               EXACT OPPOSITE MOVEMENT.

               This is the key to the
               "stay with my hands" feeling.
            */

            totalMovement.sub(
                handDelta[i]
            );


            pushingHands++;

        }


        /*
           Remember state for next frame.
        */

        previousHands[i].copy(
            handPositions[i]
        );


        handWasTouching[i]=
            handTouching[i];

    }


    /*
       Apply the hand displacement directly
       to the PLAYER.

       NOT the hands.
    */

    if(
        pushingHands>0
    ){

        totalMovement.multiplyScalar(
            PUSH_MULTIPLIER/
            pushingHands
        );


        /*
           Save a little momentum for when
           the hand leaves the surface.
        */

        velocity.multiplyScalar(
            .5
        );


        velocity.add(
            totalMovement
        );


        /*
           Directly move the player by a
           portion of the push this frame.

           This makes the hand/body relationship
           much tighter than using only velocity.
        */

        player.position.add(
            totalMovement
        );

    }

}


/* =====================================================
   PLAYER PHYSICS
===================================================== */

function updatePlayerPhysics(delta){

    /*
       Gravity.

       Don't use gravity while hands are
       actively pushing upward.
    */

    velocity.y +=
        GRAVITY*
        delta;


    /*
       Limit falling speed.
    */

    if(
        velocity.y < -8
    ){

        velocity.y=-8;

    }


    /*
       Apply only the remaining velocity.

       Hand movement itself was already
       applied directly above.
    */

    player.position.addScaledVector(
        velocity,
        delta
    );


    /*
       Friction.

       This gives released hand movement
       a little momentum without letting
       it accelerate forever.
    */

    velocity.x *=
        Math.pow(
            .82,
            delta*60
        );


    velocity.z *=
        Math.pow(
            .82,
            delta*60
        );


    velocity.y *=
        Math.pow(
            .90,
            delta*60
        );


    /*
       Maximum speed.
    */

    const horizontalSpeed=
        Math.sqrt(
            velocity.x*velocity.x+
            velocity.z*velocity.z
        );


    if(
        horizontalSpeed>
        MAX_RELEASE_SPEED
    ){

        const scale=
            MAX_RELEASE_SPEED/
            horizontalSpeed;


        velocity.x*=scale;
        velocity.z*=scale;

    }


    /*
       Floor.

       Player origin is at floor level.
    */

    if(
        player.position.y<0
    ){

        player.position.y=0;


        if(
            velocity.y<0
        ){

            velocity.y=0;

        }

    }


    /*
       Fell out.
    */

    if(
        player.position.y<-8
    ){

        resetPlayer();

    }

}


/* =====================================================
   SIMPLE BODY COLLISION
===================================================== */

function playerCollision(){

    const playerWorld=
        player.position;


    for(
        const object of colliders
    ){

        const box=
            new THREE.Box3()
                .setFromObject(
                    object
                );


        /*
           Don't let the body get deeply inside
           walls.

           This is intentionally softer than
           hand collision because hands are the
           main locomotion system.
        */

        const expanded=
            box.clone()
                .expandByScalar(
                    PLAYER_RADIUS
                );


        if(
            expanded.containsPoint(
                playerWorld
            )
        ){

            const center=
                box.getCenter(
                    new THREE.Vector3()
                );


            const dx=
                playerWorld.x-
                center.x;


            const dz=
                playerWorld.z-
                center.z;


            if(
                Math.abs(dx)>
                Math.abs(dz)
            ){

                if(dx>0){

                    player.position.x=
                        box.max.x+
                        PLAYER_RADIUS;

                }else{

                    player.position.x=
                        box.min.x-
                        PLAYER_RADIUS;

                }


                velocity.x=0;

            }else{

                if(dz>0){

                    player.position.z=
                        box.max.z+
                        PLAYER_RADIUS;

                }else{

                    player.position.z=
                        box.min.z-
                        PLAYER_RADIUS;

                }


                velocity.z=0;

            }

        }

    }

}


/* =====================================================
   TURNING
===================================================== */

/*
   Disabled for now.

   This prevents joystick input from
   accidentally causing automatic rotation.

   We'll add proper snap/smooth turning
   after the locomotion is solid.
*/

function updateTurning(){

    return;

}


/* =====================================================
   ROBOT AI
===================================================== */

function updateRobots(delta){

    for(
        const robot of robots
    ){

        const target=
            player.position.clone();


        target.y=
            robot.position.y;


        const direction=
            target.sub(
                robot.position
            );


        const distance=
            direction.length();


        if(
            distance<.01
        ){

            continue;

        }


        direction.normalize();


        let speed=2;


        if(
            distance<8
        ){

            speed=3.5;

        }


        if(
            distance<4
        ){

            speed=4.5;

        }


        robot.position.add(
            direction.multiplyScalar(
                speed*delta
            )
        );


        robot.lookAt(
            player.position.x,
            robot.position.y,
            player.position.z
        );


        if(
            robot.position.distanceTo(
                player.position
            )<1.3
        ){

            status.textContent=
                "🤖 TAGGED! Press trigger to reset.";

            velocity.set(
                0,
                0,
                0
            );

        }

    }

}


/* =====================================================
   DEBUG
===================================================== */

function updateDebug(){

    let text="";


    for(
        let i=0;
        i<2;
        i++
    ){

        const p=
            handPositions[i];


        text+=
            (i===0?"L":"R")+
            ": "+
            p.x.toFixed(2)+
            " "+
            p.y.toFixed(2)+
            " "+
            p.z.toFixed(2);


        text+=
            handTouching[i]
                ? " [TOUCH]"
                : " [AIR]";


        if(i===0){

            text+="<br>";

        }

    }


    debug.innerHTML=
        text;

}


/* =====================================================
   MAIN LOOP
===================================================== */

function gameLoop(){

    const now=
        performance.now();


    let delta=
        (now-lastTime)/
        1000;


    lastTime=
        now;


    /*
       Prevent huge physics jumps.
    */

    delta=
        Math.min(
            delta,
            .05
        );


    /*
       FIRST:
       use tracked hands to move body.
    */

    updateGTAGMovement();


    /*
       THEN:
       gravity + momentum.
    */

    updatePlayerPhysics(
        delta
    );


    /*
       Body collision.
    */

    playerCollision();


    /*
       Robots.
    */

    if(
        mode==="tag"
    ){

        updateRobots(
            delta
        );

    }


    /*
       Finish.
    */

    if(
        mode==="parkour" &&
        player.position.z<-23
    ){

        status.textContent=
            "🏆 PARKOUR COMPLETE!";

    }


    updateDebug();


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   RESET
===================================================== */

function resetPlayer(){

    if(!player)
        return;


    /*
       Move BODY only.

       Never manually reposition
       the XR camera.
    */

    player.position.set(
        spawnPoint.x,
        0,
        spawnPoint.z
    );


    player.rotation.set(
        0,
        0,
        0
    );


    velocity.set(
        0,
        0,
        0
    );


    /*
       Reset hand history.

       This prevents the game from interpreting
       the reset as a giant hand movement.
    */

    for(
        let i=0;
        i<2;
        i++
    ){

        handInitialized[i]=false;

        handWasTouching[i]=false;

        handTouching[i]=false;

    }

}


/* =====================================================
   SWITCH MAP
===================================================== */

function switchMode(
    newMode
){

    if(
        newMode==="parkour"
    ){

        buildParkour();

    }else{

        buildRobotTag();

    }


    resetPlayer();

}


/* =====================================================
   START VR
===================================================== */

document.getElementById(
    "startVR"
).onclick=
async()=>{

    try{

        init();


        if(
            !navigator.xr
        ){

            alert(
                "WebXR is not available."
            );

            return;

        }


        const supported=
            await navigator.xr
                .isSessionSupported(
                    "immersive-vr"
                );


        if(
            !supported
        ){

            alert(
                "Immersive VR is not supported."
            );

            return;

        }


        const session=
            await navigator.xr
                .requestSession(

                    "immersive-vr",

                    {
                        requiredFeatures:[
                            "local-floor"
                        ],

                        optionalFeatures:[
                            "bounded-floor"
                        ]
                    }

                );


        await renderer.xr.setSession(
            session
        );


        menu.style.display=
            "none";


        status.textContent=
            "🐒 VR ACTIVE — PUSH OFF THE WORLD!";


        session.addEventListener(
            "end",
            ()=>{

                menu.style.display=
                    "flex";

                status.textContent=
                    "VR session ended.";

            }
        );


    }catch(error){

        console.error(
            error
        );


        alert(
            "VR error:\n"+
            error.message
        );

    }

};


/* =====================================================
   PARKOUR BUTTON
===================================================== */

document.getElementById(
    "parkourBtn"
).onclick=
()=>{

    init();

    switchMode(
        "parkour"
    );

    menu.style.display=
        "none";

};


/* =====================================================
   ROBOT TAG BUTTON
===================================================== */

document.getElementById(
    "tagBtn"
).onclick=
()=>{

    init();

    switchMode(
        "tag"
    );

    menu.style.display=
        "none";

};


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        if(
            !camera ||
            !renderer
        ){

            return;

        }


        camera.aspect=
            window.innerWidth/
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>
